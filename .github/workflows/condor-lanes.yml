name: condor-lanes

# Opt-in lane backend verification: proves the HTCondor adapter honors
# the LaneExecutor port contract on Linux, and that a real lane routes
# through the pool end to end. The default validate workflow stays
# scheduler-free; this job only runs when the backend's own surface
# changes.

on:
  pull_request:
    paths:
      - 'src/issue_orchestrator/adapters/condor/**'
      - 'src/issue_orchestrator/adapters/direct_lane_executor.py'
      - 'src/issue_orchestrator/domain/lane_execution.py'
      - 'src/issue_orchestrator/ports/lane_executor.py'
      - 'src/issue_orchestrator/ports/lane_policy_check.py'
      - 'src/issue_orchestrator/execution/lane_backends.py'
      - 'src/issue_orchestrator/ports/lane_yield_signal.py'
      - 'src/issue_orchestrator/infra/lane_declarations.py'
      - '.issue-orchestrator/lanes.yaml'
      - 'tests/unit/test_lane_declarations.py'
      - 'src/issue_orchestrator/execution/lane_yield.py'
      - 'src/issue_orchestrator/adapters/condor/chirp_yield_signal.py'
      - 'src/issue_orchestrator/entrypoints/pytest_cooperative_yield.py'
      - 'tests/unit/execution/test_lane_yield.py'
      - 'tests/unit/adapters/condor/test_chirp_yield_signal.py'
      - 'tests/unit/test_pytest_cooperative_yield.py'
      - 'src/issue_orchestrator/entrypoints/cli_tools/lane_run.py'
      - 'src/issue_orchestrator/entrypoints/cli_tools/lane_preflight.py'
      - 'tests/unit/lane_executor_contract.py'
      - 'tests/integration/test_condor_lane_executor.py'
      - 'tests/integration/test_condor_pool_policy.py'
      - 'scripts/condor-personal.sh'
      - 'scripts/lane_slices.py'
      - 'tests/unit/test_lane_slices.py'
      - 'tests/unit/test_condor_personal_script.py'
      - 'tests/unit/test_lane_backends_registry.py'
      - 'tests/unit/test_validate_gate_lane_coverage.py'
      - 'Makefile'
      - '.issue-orchestrator/config/modes/**'
      - '.github/workflows/condor-lanes.yml'

concurrency:
  group: condor-lanes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  condor-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Install HTCondor (personal pool)
        run: |
          # Deliberately the plain distro package - the exact path the
          # user docs prescribe. It boots only a master (no schedd), so
          # this job exercises the helper's personal-role fallback and
          # role assertion rather than pre-satisfying them (a minicondor
          # install would make this run vacuous). Version pinning comes
          # from the distro archive of the pinned runner image, per
          # ADR-0007's rejection of unpinned curl|bash installers.
          sudo apt-get update
          sudo apt-get install -y htcondor
          bash scripts/condor-personal.sh up

      - name: Contract suite against the live pool
        run: |
          .venv/bin/python -m pytest tests/integration/test_condor_lane_executor.py \
            tests/integration/test_condor_pool_policy.py \
            -q -m "requires_infra and not requires_backoff_pool" --tb=short

      # The pool-policy self-check on a LINUX pool, which is where the
      # settings it guards actually differ from the shipped defaults
      # (MOUNT_UNDER_SCRATCH ships as /tmp,/var/tmp here). Runs the
      # target the gate itself runs, so a drifted helper fails CI the
      # same way it would fail a developer's gate.
      - name: Pool-policy preflight
        run: make lane-preflight LANE_EXECUTOR=condor

      # The typecheck lane is the demo deliberately: its pyright/node
      # workload is what exposed the missing memory contract (a slot
      # sized from the tiny exec wrapper's image OOMed node at ~259MB).
      # It now runs under an explicit request_memory budget and must
      # stay green as the end-to-end proof of that contract.
      - name: One real lane through the pool
        run: LANE_EXECUTOR=condor make typecheck

  # Acceptance for the opt-in load backoff policy itself, on its own
  # pool: a machine-owner load spike must freeze a suspendable lane,
  # leave a non-suspendable lane running, and thaw the frozen lane to
  # completion. Runs on a dedicated fresh-runner pool started WITH the
  # policy and aggressive thresholds — never against a shared pool,
  # where a manufactured load spike would freeze unrelated work.
  condor-backoff-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Install HTCondor with load backoff enabled
        run: |
          sudo apt-get update
          sudo apt-get install -y htcondor
          IO_CONDOR_LOAD_BACKOFF=1 \
          IO_CONDOR_SUSPEND_LOAD=1.5 \
          IO_CONDOR_CONTINUE_LOAD=1.0 \
            bash scripts/condor-personal.sh up

      - name: Load-spike acceptance
        run: |
          .venv/bin/python -m pytest tests/integration/test_condor_lane_executor.py \
            -q -m requires_backoff_pool --tb=short
